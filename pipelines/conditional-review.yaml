name: conditional-review
version: 1
description: |
  Demonstrates Phase 4 features:
    - import: reuses the security-base pipeline
    - when: skips the deep-dive when triage tokens are low
    - gossip: synthesizer reads scanner output mid-run
    - cross-run memory: synthesizer sees prior runs

model_defaults:
  planning: claude-opus-4-6
  execution: claude-sonnet-4-6
  classification: claude-haiku-4-5-20251001

agents:
  - id: deep-dive
    role: >
      Deep-dive reviewer. Only runs when the triage report is large enough
      to justify the cost. Produces an exploitability analysis.
    model: planning
    tools: [read, grep]
    memory: { max_tokens: 16000 }

  - id: synthesizer
    role: >
      Final report writer. Reads the triage output (and deep-dive when
      present) and produces a structured summary.
    model: execution
    tools: []
    memory:
      max_tokens: 6000
      include_prior_runs: true
      max_prior_runs: 3
    gossip:
      read_peers: [security-review__scanner, security-review__triage]

pipeline:
  - step: security-review
    import: security-base

  - step: deep-dive-gate
    type: gate
    condition: all_agents_completed

  - step: deep-dive
    agent: deep-dive
    when: agent.security-review__triage.tokens > 2000
    inputs: [security-review__triage]

  - step: synthesize
    agent: synthesizer
    inputs: [security-review__triage, deep-dive]

recovery:
  default:
    max: 2
    backoff: exponential
  fallback:
    skip_failed_agent: true
  escalation:
    channel: notification

budget:
  max_tokens: 200000
  max_duration_ms: 600000
  max_retries: 6
